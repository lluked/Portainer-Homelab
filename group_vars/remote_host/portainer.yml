---

# Portainer API endpoint. Runs against the loopback address because
# these tasks execute on the target host itself, alongside the
# Portainer instance deployed by playbooks/host_setup.yml.
portainer_api_url: "https://127.0.0.1:9443/api"

# Portainer's self-signed cert (unless you've replaced it) won't validate.
portainer_api_validate_certs: false

# Username and password for the Portainer instance. Read from the local
# HashiCorp Vault (see hashi_vault.yml and README.md's "Secrets" section),
# so not stored in plaintext in this repo.
portainer_username: "{{ lookup('community.hashi_vault.vault_kv2_get', 'portainer', engine_mount_point='secret', url=vault_addr, token=vault_root_token).secret.username }}"
portainer_password: "{{ lookup('community.hashi_vault.vault_kv2_get', 'portainer', engine_mount_point='secret', url=vault_addr, token=vault_root_token).secret.password }}"
