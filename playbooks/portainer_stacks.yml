---
# Deploys stacks through Terraform (see terraform/README.md) directly from
# wherever this playbook is run - not on the host itself. Terraform reaches
# Portainer's API over HTTPS at the remote_host host's address, and
# reaches the host over SSH only to create each stack's install_dir/
# volume_mounts directories (see the install_dirs resource in each stack's
# main.tf). Kept as its own play/playbook because it depends on Portainer
# itself being up, which playbooks/host_setup.yml is responsible for
# provisioning - run that first, then this playbook on its own.
#
# Requires a `terraform` binary wherever `ansible-playbook` runs this from,
# and the community.general collection (for the community.general.terraform
# module) - it isn't vendored in ansible_collections/ here, unlike the
# homelab.* collections, so install it separately if it's missing.

- hosts: localhost
  connection: local
  gather_facts: false

  vars:
    portainer_stacks_target: "{{ groups['remote_host'][0] }}"
    # inventory_hostname is the host's address itself in this inventory (no
    # separate ansible_host set) - fall back to it if that ever changes.
    portainer_stacks_target_host: "{{ hostvars[portainer_stacks_target].ansible_host | default(portainer_stacks_target) }}"
    portainer_stacks_terraform_root: "{{ playbook_dir }}/../terraform/plans"
    # Each stack's install_dirs resource runs "sudo mkdir"/"sudo chown" over
    # SSH via Terraform's own remote-exec provisioner, which (unlike Ansible's
    # become) has no way to answer an interactive sudo password prompt - it
    # just hangs forever if one appears. So this playbook grants ssh_user
    # passwordless sudo for the duration of the Terraform run only, via this
    # drop-in, then removes it again in the "always" block below - rather
    # than leaving NOPASSWD sudo configured on the host permanently.
    portainer_stacks_sudoers_path: /etc/sudoers.d/portainer_stacks_terraform

    # Each entry's "name" selects the terraform/<name> directory; any other
    # keys are extra Terraform variables merged on top of the common set
    portainer_stacks:
      - name: traefik
      - name: adguardhome
      - name: homeassistant

  tasks:
    - name: "run Terraform with temporary passwordless sudo on the host"
      block:
        - name: "check for a pre-existing sudoers drop-in at {{ portainer_stacks_sudoers_path }}"
          become: true
          connection: ssh
          delegate_to: "{{ portainer_stacks_target }}"
          ansible.builtin.stat:
            path: "{{ portainer_stacks_sudoers_path }}"
          register: portainer_stacks_sudoers_pre_check

        - name: "grant {{ hostvars[portainer_stacks_target].ansible_user }} temporary passwordless sudo for Terraform's SSH provisioner"
          become: true
          connection: ssh
          delegate_to: "{{ portainer_stacks_target }}"
          # Don't touch it if it's already there - it's not this playbook's to
          # manage (and the always block below only removes it again if this
          # task is the one that created it).
          when: portainer_stacks_sudoers_pre_check.stat.exists is defined and not portainer_stacks_sudoers_pre_check.stat.exists
          ansible.builtin.copy:
            dest: "{{ portainer_stacks_sudoers_path }}"
            content: "{{ hostvars[portainer_stacks_target].ansible_user }} ALL=(ALL) NOPASSWD:ALL\n"
            owner: root
            group: root
            mode: "0440"
            validate: "visudo -cf %s"

        - name: "deploy stack via Terraform"
          vars:
            portainer_stacks_base_variables:
              portainer_api_url: "https://{{ portainer_stacks_target_host }}:9443/api"
              # hostvars, not bare refs: these live in group_vars/remote_host/*,
              # which is only attached to the remote_host group's members - this
              # play runs on localhost, which isn't one of them. portainer_username/
              # portainer_password are themselves resolved from Vault there (see
              # group_vars/remote_host/portainer.yml) - each stack's Terraform
              # also has its own Vault fallback for these two (see
              # terraform/*/provider.tf) for when it's run standalone, without
              # Ansible in the loop at all.
              portainer_username: "{{ hostvars[portainer_stacks_target].portainer_username }}"
              portainer_password: "{{ hostvars[portainer_stacks_target].portainer_password }}"
              portainer_api_validate_certs: "{{ hostvars[portainer_stacks_target].portainer_api_validate_certs }}"
              ssh_host: "{{ portainer_stacks_target_host }}"
              ssh_user: "{{ hostvars[portainer_stacks_target].ansible_user }}"
              ssh_private_key_file: "{{ hostvars[portainer_stacks_target].ansible_ssh_private_key_file }}"
          community.general.terraform:
            project_path: "{{ portainer_stacks_terraform_root }}/{{ portainer_stack.name }}"
            state: present
            force_init: true
            complex_vars: true
            # Any keys on the stack's entry besides "name" (e.g. env) are passed through as extra Terraform variables here.
            variables: "{{ portainer_stacks_base_variables | combine(portainer_stack | dict2items | rejectattr('key', 'equalto', 'name') | items2dict) }}"
          loop: "{{ portainer_stacks }}"
          loop_control:
            loop_var: portainer_stack
            label: "{{ portainer_stack.name }}"
          # no_log: true
      always:
        - name: "revoke {{ hostvars[portainer_stacks_target].ansible_user }}'s temporary passwordless sudo"
          become: true
          connection: ssh
          delegate_to: "{{ portainer_stacks_target }}"
          # Only remove it if the grant task above is the one that put it
          # there - never touch a drop-in that already existed beforehand.
          when: portainer_stacks_sudoers_pre_check.stat.exists is defined and not portainer_stacks_sudoers_pre_check.stat.exists
          ansible.builtin.file:
            path: "{{ portainer_stacks_sudoers_path }}"
            state: absent
